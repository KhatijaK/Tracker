<!--
================================================================================
  JOB SEARCH TRACKER
  A single-file dashboard for running a structured 12-week job search.

  WHAT IT DOES
    Tracks daily and weekly application counts against a fixed plan, shows which
    employers to contact in the current week, keeps a per-week task checklist,
    and charts the application funnel (applied > replied > screened > interview
    > offer) so the response rate can be checked against a realistic baseline.

  WHY ONE FILE
    No build step, no dependencies, no server. It can be opened from a local
    disk, a static host, or an embedded frame and behaves the same in all three.
    The only external request is the webfont, and it degrades to system fonts.

  ARCHITECTURE
    Plain ES5-compatible JavaScript, no framework. One state object (S) is the
    single source of truth. Every mutation goes through commit(), which does
    three things in a fixed order:

        commit(fn)  ->  fn() mutates S
                    ->  render() repaints from S
                    ->  saveState() persists in the background

    Rendering is a full repaint of innerHTML rather than a diff. At this data
    size (a few hundred rows) that is faster to reason about than incremental
    DOM updates and removes a whole class of stale-view bugs.

  TWO ENVIRONMENT PROBLEMS THIS CODE WORKS AROUND
    1. Date parsing.  toLocaleDateString('en-CA') returns YYYY-MM-DD in some
       browsers and not others. When it does not, Date parsing yields NaN, the
       computed week number becomes NaN, and an array lookup returns undefined.
       Fixed by building and parsing every date from explicit numeric parts.
       See the "DATES" section.

    2. Sandbox restrictions.  When embedded in a restricted frame, prompt(),
       confirm(), alert(), and file downloads are blocked silently: no error is
       thrown, the call just does nothing. All user input and data export is
       therefore done with ordinary page elements. See the "CONTROLS" section.

  PERSISTENCE
    Writes to two stores on every save and reads from whichever holds more data.
    If both are unavailable it keeps running from memory and says so plainly
    rather than pretending to save. See the "STORAGE" section.

  SECTIONS BELOW
    STYLES      presentation
    CONFIG      plan dates and the 12-week schedule data
    DATES       locale-independent date helpers
    STATE       the state object, validation, and persistence
    RENDER      view construction
    CONTROLS    event wiring and sandbox-safe user input
================================================================================
-->

<script>
(function(){
  "use strict";
  /* ============================ CONFIG ==============================
     KEY is versioned. Bumping the version makes the app ignore anything
     written by an earlier build, which is the cheapest possible migration
     strategy: old data is skipped rather than parsed and repaired.
     ================================================================== */

  var KEY = 'jobsearch:v2';
  var APP = document.getElementById('app');

  /* Week 1 = Thu Jul 30 2026. Core 1 = Friday of week 6. Core 2 = Friday of week 10. */
  var DEFAULTS = { start:'2026-07-30', exam1:'2026-09-04', exam2:'2026-10-02' };

  /* ============================= DATES ==============================
     Every date in this app is a plain 'YYYY-MM-DD' string. Nothing is
     ever handed to the browser's own date-string parser.

     ROOT CAUSE THIS SOLVES
       The original build used toLocaleDateString('en-CA') to produce
       today's key, assuming it always returns YYYY-MM-DD. Chrome does.
       WebKit did not, so the value came back in a form that
       new Date(str) could not read. That produced an Invalid Date,
       daysBetween returned NaN, the week number became NaN, and
       WEEKS[NaN - 1] was undefined. The visible symptom was a
       TypeError far away from the actual fault.

     THE FIX
       iso()    builds the string from getFullYear/getMonth/getDate.
       parseD() reads it back with a regex and the numeric Date
                constructor, which has no locale behaviour at all.
       Both anchor at 12:00 local so daylight-saving shifts can never
       push a date across a day boundary during subtraction.

     parseD returns null rather than an Invalid Date, so callers get a
     falsy value they must handle instead of a NaN that spreads silently.
     ================================================================== */
  function iso(d){
    var y=d.getFullYear(),
        m=String(d.getMonth()+1),
        a=String(d.getDate());
    if(m.length<2) m='0'+m;
    if(a.length<2) a='0'+a;
    return y+'-'+m+'-'+a;
  }
  function parseD(s){
    if(typeof s!=='string') return null;
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
    if(!m) return null;
    var d=new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }
  function isDate(s){ return parseD(s)!==null; }
  function todayKey(){ return iso(new Date()); }
  function daysBetween(a,b){
    var A=parseD(a), B=parseD(b);
    if(!A||!B) return 0;
    return Math.round((B.getTime()-A.getTime())/86400000);
  }
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmt(s){ var d=parseD(s); return d ? MON[d.getMonth()]+' '+d.getDate() : '\u2014'; }
  function longToday(){ var d=new Date(); return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate(); }

  /* ============================ PLAN DATA ===========================
     The 12-week schedule. Content lives here as data rather than in the
     markup so the plan can be edited without touching rendering logic.

       n        week number, 1-12
       apps     application target for that week, and the number of
                squares drawn in that row of the progress grid
       label    short name shown in the header
       tname    heading for the "hit these this week" panel
       targets  employers to contact, rendered as chips
       hint     one line of guidance under the targets
       tasks    checklist items; completion is stored by "week:index"
     ================================================================== */

  var WEEKS = [
    {n:1,  apps:20, label:'Build your tools',
     tname:'MSPs + volunteer outreach',
     targets:['Accellis','Kloud9 IT','FIT Technologies','Green Line','Keystone Tech','Ashton Solutions','Acroment','QualityIP','MCPc','ETC TechSolutions','Integrated Network Concepts','BlueBridge','TEC Communications','Securafy','CETech','CGB Tech','CTMS','NetOps','Calyx','Hurricane Labs'],
     hint:'Email every MSP even where there is no posting. Then 15 nonprofits about volunteering.',
     tasks:['Rewrite resume \u2014 one page, plain text, Cleveland OH on it','Add Skills line + Projects section','Fix LinkedIn: location, Open to Work, headline','Connect with 20 people on LinkedIn','Email 20 MSPs','Email 15 nonprofits about volunteering','Make a GovernmentJobs.com account + alerts','Build the home lab: VirtualBox + Windows Server + domain','Buy the A+ Core 1 voucher and confirm Sep 4']},

    {n:2,  apps:20, label:'Colleges and government',
     tname:'Colleges + public sector',
     targets:['Case Western','Cleveland State','Tri-C','John Carroll','Baldwin Wallace','Ursuline','Lakeland CC','Lorain County CC','Oberlin','Kent State','Univ of Akron','Cuyahoga County','City of Cleveland','Cleveland Metroparks','RTA','Cleveland Public Library','Cuyahoga County Library','Sewer District','Port of Cleveland'],
     hint:'Government takes 6\u201310 weeks. Apply now and forget about it.',
     tasks:['Start A+ Core 1 \u2014 Professor Messer, 90 min/day','Take handwritten notes','Follow up with silent MSPs','Start the volunteer role if anyone said yes']},

    {n:3,  apps:20, label:'Healthcare and software',
     tname:'Hospitals + software companies',
     targets:['Cleveland Clinic','University Hospitals','MetroHealth','Summa Health','Akron Children\u2019s','Southwest General','Sisters of Charity','Signature Health','Medical Mutual','Menorah Park','Judson','Hyland','MRI Software','OverDrive','Park Place Tech','Vox Mobile'],
     hint:'At hospitals also search "Application Support Analyst" \u2014 that is where the Epic path starts.',
     tasks:['Core 1: networking + hardware','Install osTicket or Jira Service Management','Create and work 15 practice tickets','Sign up for a free Microsoft 365 Developer tenant']},

    {n:4,  apps:20, label:'Corporate and law firms',
     tname:'Corporate IT + law/accounting',
     targets:['Progressive','KeyBank','Sherwin-Williams','Eaton','Parker Hannifin','TransDigm','STERIS','Rockwell','Lincoln Electric','Nordson','Swagelok','Applied Industrial','Cleveland-Cliffs','Moen','Third Federal','Jones Day','Squire Patton Boggs','Thompson Hine','Benesch','Calfee','Ulmer & Berne','Tucker Ellis','CBIZ','Cohen & Company'],
     hint:'Law firms are the sleeper. Internal help desks, good pay, almost no CS grads apply.',
     tasks:['Write out the "why help desk with a CS degree" answer','Write out the "what have you been doing" answer','Say both out loud 20 times','Practice the 6 technical questions','Finish Core 1 content','Buy Jason Dion practice exams']},

    {n:5,  apps:20, label:'Schools, suburbs, second pass',
     tname:'K-12 + suburbs + MSPs again',
     targets:['CMSD','ESC of Northeast Ohio','Lakewood','Parma','Strongsville','Solon','Shaker Heights','Cleveland Hts-Univ Hts','Mentor','Westlake','Berea','Euclid','Saint Ignatius','Gilmour','Hawken','University School','Laurel','+ all 20 MSPs again'],
     hint:'Check the ESC of Northeast Ohio first \u2014 they run shared IT for many districts at once.',
     tasks:['Practice exams daily, review every wrong answer','Hit 85% before test day','Write up the home lab with screenshots','Link the lab on your resume']},

    {n:6,  apps:15, label:'Take the test',
     tname:'Light week \u2014 exam Friday Sep 4',
     targets:['Whatever is new and posted this week'],
     hint:'Monday to Thursday: review only, no new material.',
     tasks:['Review only \u2014 no new material','Sit for 220-1201 on Friday','If passed: update resume + LinkedIn same day','If passed: message every MSP and contact']},

    {n:7,  apps:20, label:'Widen the net',
     tname:'Cycle back + analyst roles',
     targets:['All MSPs again','All colleges again','+ business analyst entry level','+ reporting analyst','+ data analyst junior','+ implementation specialist','+ onboarding specialist','+ technical account manager'],
     hint:'With half a cert and a documented lab, junior analyst roles are now realistic.',
     tasks:['Start Core 2 (220-1202)','Confirm the Oct 2 exam booking','Add the new search terms to your rotation']},

    {n:8,  apps:20, label:'Check your numbers',
     tname:'Everything \u2014 plus a hard look at the funnel',
     targets:['Full list, third pass'],
     hint:'Read the checkpoint panel above. Be honest about which problem you have.',
     tasks:['Run the Week 8 diagnostic','Fix whichever problem the numbers show','Core 2 content']},

    {n:9,  apps:20, label:'Grind',
     tname:'Full list',
     targets:['Full list, keep cycling'],
     hint:'Some places have seen your name three times now. That is good, not bad.',
     tasks:['Core 2 content','Keep the volunteer hours going']},

    {n:10, apps:20, label:'Finish the certificate',
     tname:'Full list \u2014 exam Friday Oct 2',
     targets:['Full list, keep cycling'],
     hint:'Exam Friday. Then immediately re-apply to your 10 best rejections.',
     tasks:['Core 2 practice exams','Sit for 220-1202 on Friday','Update resume, LinkedIn, job boards same day','Email every contact: "I\u2019m A+ certified"','Re-apply to 10 best rejections from Weeks 2\u20135']},

    {n:11, apps:15, label:'Close it out',
     tname:'Careful applications + live processes',
     targets:['Anywhere that rejected you before Week 6'],
     hint:'Answer everything within 4 hours. Speed reads as enthusiasm.',
     tasks:['Thank-you email within 24h of every interview','Answer all messages within 4 hours','Say yes to contract roles']},

    {n:12, apps:15, label:'Close it out',
     tname:'Offers',
     targets:['Finish what is live'],
     hint:'Get the hybrid schedule in writing. Ask about the path out of Tier 1.',
     tasks:['Confirm hybrid schedule in writing','Ask about certification reimbursement','Ask about promotion path out of Tier 1','If under $45k, ask once about flexibility']}
  ];

  /* ============================== STATE =============================
     STATUSES is ordered as a funnel. Anything at or past a given stage
     counts toward every earlier stage, so an application marked
     'interview' is also counted as replied and screened. That keeps the
     funnel monotonic without storing redundant flags.

     S is the whole application state:
       { start, exam1, exam2, apps: [...], tasks: { "week:index": bool } }
     MODE records which persistence layer last accepted a write.
     ================================================================== */

  var STATUSES = ['applied','replied','screen','interview','offer','rejected'];
  var SCOLOR = {applied:'#7B8B98',replied:'#6398C6',screen:'#6398C6',interview:'#E9A13B',offer:'#5FA97C',rejected:'#4A5862'};

  var S = null, MODE = 'memory';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clampWeek(n){
    n = Math.floor(Number(n));
    if(!isFinite(n) || n < 1) return 1;
    return n > 12 ? 12 : n;
  }
  function weekOf(ds){
    if(!isDate(ds)) return 1;
    return clampWeek(Math.floor(daysBetween(S.start, ds)/7) + 1);
  }
  function currentWeek(){ return weekOf(todayKey()); }

  /* make any loaded blob safe before it touches render */
  /* Rebuilds a known-good state object from whatever came out of storage.

     Nothing loaded from storage is trusted: it may be from an older
     build, half-written by an interrupted save, or corrupt. Rather than
     validating in place, this constructs a fresh object with defaults
     and copies across only fields that pass a type or format check.
     Malformed application rows are dropped instead of rendered.

     This is the boundary that stops bad data from ever reaching render(),
     which is what turned the original date bug into a blank page.        */
  function sanitize(raw){
    var o = (raw && typeof raw === 'object') ? raw : {};
    var out = {
      start: isDate(o.start) ? o.start : DEFAULTS.start,
      exam1: isDate(o.exam1) ? o.exam1 : DEFAULTS.exam1,
      exam2: isDate(o.exam2) ? o.exam2 : DEFAULTS.exam2,
      tasks: (o.tasks && typeof o.tasks === 'object') ? o.tasks : {},
      apps: []
    };
    if(Array.isArray(o.apps)){
      out.apps = o.apps.filter(function(a){
        return a && typeof a === 'object' && typeof a.company === 'string' && isDate(a.date);
      }).map(function(a){
        return {
          id: String(a.id || (Date.now()+''+Math.random())),
          company: String(a.company),
          role: typeof a.role === 'string' ? a.role : '',
          date: a.date,
          status: STATUSES.indexOf(a.status) >= 0 ? a.status : 'applied'
        };
      });
    }
    return out;
  }

  /* ============================= STORAGE ============================
     Two independent stores, written on every save, read on every load.

       - a host-provided key/value store, which may be unavailable or
         return a server error at any time
       - the browser's own local store, which may be blocked outright by
         privacy settings or by frame sandboxing

     Neither is reliable alone, so writes go to both and failures are
     swallowed per-store. On load, both are read and the copy holding
     more applications wins; that treats "more data" as "more recent",
     which is correct here because entries are only ever appended.

     If both refuse the write, MODE becomes 'memory' and the UI shows a
     visible warning. Silently pretending to save would be worse than
     not saving, since the data would be lost without warning.
     ================================================================== */

  function loadState(){
    var fromCloud = null, fromLocal = null;
    var p;
    try{ p = Promise.resolve(window.storage.get(KEY)); }
    catch(e){ p = Promise.reject(e); }

    return p.then(function(r){
      if(r && r.value) fromCloud = JSON.parse(r.value);
    }).catch(function(){}).then(function(){
      try{
        var v = localStorage.getItem(KEY);
        if(v) fromLocal = JSON.parse(v);
      }catch(e){}

      var a = fromCloud, b = fromLocal, found;
      if(!a) found = b;
      else if(!b) found = a;
      else found = ((a.apps||[]).length >= (b.apps||[]).length) ? a : b;

      S = sanitize(found);
      return saveState();
    });
  }

  function saveState(){
    var str;
    try{ str = JSON.stringify(S); }catch(e){ MODE='memory'; return Promise.resolve(); }
    var cloud = false, local = false;
    try{ localStorage.setItem(KEY, str); local = true; }catch(e){}
    var p;
    try{ p = Promise.resolve(window.storage.set(KEY, str)).then(function(r){ if(r) cloud = true; }); }
    catch(e){ p = Promise.resolve(); }
    return p.catch(function(){}).then(function(){
      MODE = cloud ? 'cloud' : (local ? 'local' : 'memory');
    });
  }

  function commit(fn){
    try{ fn(); }catch(e){ console.error(e); }
    safeRender();
    saveState().then(function(){
      var p = document.getElementById('pill'); if(p) paintPill(p);
    });
  }

  function paintPill(el){
    var map = {
      cloud:['ok','Saving'],
      local:['ok','Saved on this device'],
      memory:['bad','Not saving \u2014 back up before you close']
    };
    var m = map[MODE] || map.memory;
    el.className = 'pill ' + m[0];
    el.textContent = m[1];
  }

  /* ---------------- render ---------------- */
  /* ============================== RENDER ============================
     safeRender wraps render in a try/catch so an unexpected failure
     produces a readable message and a recovery button instead of a
     blank screen. The stored data is left untouched, so reloading is
     usually enough. This is the error boundary the first build lacked.
     ================================================================== */

  function safeRender(){
    try{ render(); }
    catch(err){
      console.error(err);
      APP.innerHTML = '<div class="wrap"><div class="flag warn" style="margin-top:40px">' +
        '<h3>Something broke</h3><p>' + esc(err && err.message ? err.message : String(err)) +
        '</p><p>Your saved data is untouched. Try reloading; if it keeps happening, hit reset below.</p>' +
        '<button class="ghost" id="err-reset" style="margin-top:10px">Reset everything</button></div></div>';
      var b = document.getElementById('err-reset');
      if(b) b.onclick = hardReset;
    }
  }

  /* Full repaint from S. Derives every displayed number here rather than
     storing it, so there is no cached total that can drift out of sync
     with the underlying list. All user-supplied text passes through
     esc() before it reaches innerHTML.                                  */
  function render(){
    var cw = currentWeek();
    var W = WEEKS[cw-1] || WEEKS[0];
    var day = Math.max(1, daysBetween(S.start, todayKey()) + 1);
    var tk = todayKey();

    var byWeek = {};
    S.apps.forEach(function(a){ var w = weekOf(a.date); byWeek[w] = (byWeek[w]||0) + 1; });

    var thisWeek = byWeek[cw] || 0;
    var total = S.apps.length;
    var today = S.apps.filter(function(a){ return a.date === tk; }).length;

    var has = function(list){ return S.apps.filter(function(a){ return list.indexOf(a.status) >= 0; }).length; };
    var replied = has(['replied','screen','interview','offer']);
    var screens = has(['screen','interview','offer']);
    var ivs     = has(['interview','offer']);
    var offers  = has(['offer']);
    var rate = total ? Math.round(replied/total*1000)/10 : 0;

    var d1 = isDate(S.exam1) ? daysBetween(tk, S.exam1) : null;
    var d2 = isDate(S.exam2) ? daysBetween(tk, S.exam2) : null;
    var nextExam = (d1 !== null && d1 >= 0) ? {n:'Core 1', d:d1}
                 : ((d2 !== null && d2 >= 0) ? {n:'Core 2', d:d2} : null);

    var gridRows = WEEKS.map(function(w){
      var c = byWeek[w.n] || 0,
          filled = Math.min(c, w.apps),
          over = Math.max(0, c - w.apps),
          past = w.n < cw,
          cells = '';
      for(var i=0;i<w.apps;i++){
        cells += '<div class="cell ' + (i<filled?'on':'') + ' ' + (past?'past':'') + '"></div>';
      }
      return '<div class="grow ' + (w.n===cw?'cur':'') + '">' +
        '<div class="grow-l">WK ' + (w.n<10?'0':'') + w.n + '</div>' +
        '<div class="cells">' + cells + '</div>' +
        (over ? '<div class="over">+' + over + '</div>' : '') + '</div>';
    }).join('');

    var rows = S.apps.slice().reverse().slice(0,40).map(function(a){
      return '<tr><td class="mono">W' + weekOf(a.date) + ' \u00b7 ' + fmt(a.date) + '</td>' +
        '<td><span class="co">' + esc(a.company) + '</span>' +
        (a.role ? '<br><span class="ro">' + esc(a.role) + '</span>' : '') + '</td>' +
        '<td><select class="st" data-id="' + esc(a.id) + '" style="color:' + (SCOLOR[a.status]||'#7B8B98') + '">' +
        STATUSES.map(function(s){ return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+s+'</option>'; }).join('') +
        '</select></td>' +
        '<td><button class="del" data-del="' + esc(a.id) + '" title="Delete">\u00d7</button></td></tr>';
    }).join('');

    APP.innerHTML =
      '<div class="topbar"><div class="wrap"><div class="topbar-in">' +
        '<div class="brand"><div class="weeknum">' + cw + '</div><div class="brand-txt">' +
          '<div class="eyebrow">Week ' + cw + ' of 12 \u00b7 Day ' + day + '</div>' +
          '<div class="wlabel">' + esc(W.label) + '</div></div></div>' +
        '<div class="statline">' +
          '<div class="stat"><div class="k">This week</div><div class="v">' + thisWeek + '<small>/' + W.apps + '</small></div></div>' +
          '<div class="stat"><div class="k">Total out</div><div class="v">' + total + '</div></div>' +
          '<div class="stat"><div class="k">Interviews</div><div class="v">' + ivs + '</div></div>' +
          '<div class="stat"><div class="k">' + (nextExam?esc(nextExam.n):'Exams') + '</div><div class="v">' +
            (nextExam ? nextExam.d + '<small>d</small>' : '\u2014') + '</div></div>' +
        '</div></div></div></div>' +

      '<div class="wrap">' +
        (MODE==='memory' ? '<div class="flag warn"><h3>Nothing is being saved</h3>' +
          '<p>This browser is blocking storage, so anything you log will vanish when you close the tab. Hit <b>Backup</b> before you leave, or download this file and open it from your own computer \u2014 it saves normally there.</p></div>' : '') +
        flagHTML(cw, total, replied, ivs, thisWeek) +

        '<div class="panel"><div class="phead"><h2>Today \u00b7 ' + longToday() + '</h2>' +
        '<div class="note">' + today + ' of 4 logged</div></div><div class="pbody"><div class="today">' +
          '<div class="todaynum"><b style="color:' + (today>=4?'var(--green)':'var(--amber)') + '">' +
            Math.max(0, 4-today) + '</b><span>' +
            (today>=4 ? 'Done for today. Go do something else.' : 'applications left today') + '</span></div>' +
          '<div class="dots">' + [0,1,2,3].map(function(i){ return '<div class="dot ' + (i<today?'on':'') + '"></div>'; }).join('') + '</div>' +
        '</div></div></div>' +

        '<div class="panel"><div class="phead"><h2>Applications sent</h2>' +
        '<div class="note">' + total + ' logged \u00b7 one square each</div></div>' +
        '<div class="gridwrap">' + gridRows +
          '<div class="glegend">' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:var(--amber);margin-right:5px;vertical-align:middle"></span>This week</span>' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:var(--amber-dim);margin-right:5px;vertical-align:middle"></span>Banked</span>' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:#1F2A34;border:1px solid #26333E;margin-right:5px;vertical-align:middle"></span>Still owed</span>' +
          '</div></div></div>' +

        '<div class="cols">' +
          '<div class="panel"><div class="phead"><h2>Hit these this week</h2></div><div class="pbody">' +
            '<div class="tgt-title">' + esc(W.tname) + '</div><div class="chips">' +
            W.targets.map(function(t){ return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
            '</div><div class="hint">' + esc(W.hint) + '</div></div></div>' +

          '<div class="panel"><div class="phead"><h2>Week ' + cw + ' checklist</h2><div class="note">' +
            W.tasks.filter(function(_,i){ return S.tasks[cw+':'+i]; }).length + '/' + W.tasks.length +
          '</div></div><div class="pbody">' +
            W.tasks.map(function(t,i){
              var k = cw+':'+i, on = !!S.tasks[k];
              return '<div class="task ' + (on?'done':'') + '" data-k="' + k + '" tabindex="0" role="checkbox" aria-checked="' + on + '">' +
                '<div class="box">' + (on?'\u2713':'') + '</div><div class="tlabel">' + esc(t) + '</div></div>';
            }).join('') +
          '</div></div>' +
        '</div>' +

        '<div class="cols">' +
          '<div class="panel"><div class="phead"><h2>Funnel</h2></div><div class="pbody"><div class="fnl">' +
            fbar('Applied',total,total,'#4A5862') + fbar('Replied',replied,total,'#6398C6') +
            fbar('Screened',screens,total,'#6398C6') + fbar('Interview',ivs,total,'#E9A13B') +
            fbar('Offer',offers,total,'#5FA97C') +
          '</div><div class="rate">Response rate <b>' + rate + '%</b> \u00b7 normal is 4\u20138%. Below that after 100 applications, the resume is the problem.</div></div></div>' +

          '<div class="panel"><div class="phead"><h2>Log an application</h2></div><div class="pbody">' +
            '<div class="addrow">' +
              '<input type="text" id="a-co" placeholder="Company" autocomplete="off">' +
              '<input type="text" id="a-ro" placeholder="Role" autocomplete="off">' +
              '<button class="go" id="a-go">Log it</button></div>' +
            '<div class="hint">Then message someone there on LinkedIn. That is the step that doubles your reply rate.</div>' +
            '<details class="ref" style="margin-top:14px"><summary>The two answers you will be asked</summary><div class="rb">' +
              '<div class="q">"You have a CS degree \u2014 why help desk?"</div>' +
              '<blockquote>I went in thinking I\u2019d be a developer, but through school I realized the parts I actually liked were systems and helping people who are stuck. I want to build toward systems administration, and help desk is where you learn how a company actually runs.</blockquote>' +
              '<div class="q">"What have you been doing for two years?"</div>' +
              '<blockquote>I graduated in 2024, spent that time figuring out what I wanted, and lately I\u2019ve gotten serious about it \u2014 I built a lab environment at home and I\u2019m taking my A+ next month. I\u2019m ready to go.</blockquote>' +
              '<div style="margin-top:10px;color:var(--dim)">Nobody digs deeper unless you flinch.</div>' +
            '</div></details></div></div>' +
        '</div>' +

        '<div class="panel"><div class="phead"><h2>The log</h2><div class="note">' + total + ' entries</div></div>' +
        '<div class="pbody" style="padding:8px 16px 16px">' +
          (S.apps.length
            ? '<table><thead><tr><th style="width:80px">Date</th><th>Where</th><th style="width:112px">Status</th><th style="width:34px"></th></tr></thead><tbody>' +
              rows + '</tbody></table>' +
              (S.apps.length>40 ? '<div class="hint">Showing the last 40 of ' + S.apps.length + '.</div>' : '')
            : '<div class="empty">Nothing logged yet. Four a day.</div>') +
        '</div></div>' +

        '<div class="panel"><div class="phead"><h2>Settings and data</h2>' +
          '<span class="pill" id="pill">\u2026</span></div><div class="pbody">' +

          '<div class="setgrid">' +
            '<div class="setf"><label>Week 1 starts</label><input type="date" id="d-start" value="' + esc(S.start) + '"></div>' +
            '<div class="setf"><label>Core 1 exam</label><input type="date" id="d-e1" value="' + esc(S.exam1) + '"></div>' +
            '<div class="setf"><label>Core 2 exam</label><input type="date" id="d-e2" value="' + esc(S.exam2) + '"></div>' +
            '<button class="go" id="b-dates">Save dates</button>' +
            '<span class="said" id="say-dates"></span>' +
          '</div>' +

          '<details class="ref" style="margin-top:18px"><summary>Copy out your data</summary><div class="rb">' +
            '<div class="btnrow">' +
              '<button class="ghost" id="b-csv">Show as spreadsheet (CSV)</button>' +
              '<button class="ghost" id="b-backup">Show full backup</button>' +
              '<button class="ghost" id="b-copy">Copy to clipboard</button>' +
              '<span class="said" id="say-copy"></span>' +
            '</div>' +
            '<textarea id="out" readonly placeholder="Pick one above, then select all and copy."></textarea>' +
          '</div></details>' +

          '<details class="ref"><summary>Restore from a backup</summary><div class="rb">' +
            '<textarea id="inp" placeholder="Paste a backup here, then press Load."></textarea>' +
            '<div class="btnrow" style="margin-top:8px">' +
              '<button class="ghost" id="b-restore">Load it</button>' +
              '<span class="said" id="say-restore"></span>' +
            '</div>' +
          '</div></details>' +

          '<details class="ref"><summary>Start over</summary><div class="rb">' +
            '<p style="margin-bottom:10px">This deletes every application and every checkmark. Copy out your data first if you want to keep it.</p>' +
            '<div class="btnrow"><button class="ghost danger" id="b-reset">Delete everything</button>' +
            '<span class="said" id="say-reset"></span></div>' +
          '</div></details>' +

        '</div></div>' +
        '<div class="foot">WEEK 1 STARTS ' + fmt(S.start) + ' \u00b7 CORE 1 ' + fmt(S.exam1) + ' \u00b7 CORE 2 ' + fmt(S.exam2) + '</div>' +
      '</div>';

    paintPill(document.getElementById('pill'));
    wire();
  }

  function fbar(k,v,max,color){
    var pct = max ? Math.max(v>0?2:0, v/max*100) : 0;
    return '<div class="frow"><div class="fk">' + k + '</div>' +
      '<div class="fbar"><i style="width:' + pct + '%;background:' + color + '"></i></div>' +
      '<div class="fv">' + v + '</div></div>';
  }

  /* Contextual banner for the current week. Week 8 reads the live funnel
     and names the most likely bottleneck: too few applications, a resume
     that is not getting through, or interview answers that are not
     converting. Week 5 fires only when the weekly count is low, because
     that is when the effort feels futile and the numbers still look
     normal.                                                             */
  function flagHTML(cw,total,replied,ivs,thisWeek){
    if(cw===1 && total===0){
      return '<div class="flag"><h3>Day one</h3>' +
        '<p>Week 1 is not about applications. Fix the resume, fix LinkedIn, email the twenty MSPs, and get the lab running.</p>' +
        '<p>Log each MSP email here as you send it \u2014 they count.</p></div>';
    }
    if(cw===8){
      var dx;
      if(total<60) dx='You are under 60 applications. That is the whole problem, and you already know the fix.';
      else if(replied===0) dx='Zero replies on 100+ applications means the resume is not getting through. Have three people read it, strip all formatting, and confirm "Cleveland, OH" is on it.';
      else if(ivs===0) dx='Replies but no interviews. That is your two answers. Record yourself saying them and watch it back.';
      else dx='You have interviews. That is a rehearsal problem now, not a strategy problem \u2014 you are closer than it feels.';
      return '<div class="flag"><h3>Week 8 checkpoint</h3><p>' + total + ' applications \u00b7 ' + replied +
        ' replies \u00b7 ' + ivs + ' interviews.</p><p>' + dx + '</p></div>';
    }
    if(cw===5 && thisWeek<10){
      return '<div class="flag"><h3>Heads up</h3>' +
        '<p>Week 5 is when this gets demoralizing. Eighty applications out, maybe two replies, and it feels like proof it isn\u2019t working.</p>' +
        '<p>It isn\u2019t proof. That is what a normal funnel looks like right now. Keep the number.</p></div>';
    }
    if(cw===6||cw===10){
      return '<div class="flag"><h3>Exam week</h3>' +
        '<p>Review only until Friday \u2014 no new material. Light on applications.</p>' +
        '<p>If you pass, update your resume and LinkedIn the same day and message every contact you have.</p></div>';
    }
    return '';
  }

  function hardReset(){
    try{ window.storage.delete(KEY); }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
    commit(function(){ S = sanitize(null); });
  }

  /* ============================= CONTROLS ===========================
     Handlers are rebound after every repaint because render() replaces
     the whole subtree. At this element count that is cheaper than the
     bookkeeping needed for delegated listeners.

     SANDBOX CONSTRAINT
       In a restricted frame the browser blocks prompt(), confirm(),
       alert(), and programmatic file downloads. Critically it blocks
       them silently: no exception is raised and no console error
       appears, so a button wired to prompt() looks broken with nothing
       to diagnose. Every one of those was replaced:

         prompt()   -> <input type="date"> in the settings panel
         confirm()  -> a two-press arm-then-confirm button
         alert()    -> inline status text next to the control
         download   -> data written into a <textarea>, pre-selected,
                       with a copy button that falls back to manual copy

       The rule this follows: never depend on a browser affordance the
       host frame can revoke. Everything here is ordinary DOM.
     ================================================================== */

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('.task'), function(el){
      var go = function(){ commit(function(){ var k=el.getAttribute('data-k'); S.tasks[k] = !S.tasks[k]; }); };
      el.onclick = go;
      el.onkeydown = function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); go(); } };
    });

    var co = document.getElementById('a-co'), ro = document.getElementById('a-ro');
    function add(){
      var c = (co.value||'').trim();
      if(!c){ co.focus(); return; }
      var r = (ro.value||'').trim();
      commit(function(){
        S.apps.push({ id: Date.now()+''+Math.random().toString(36).slice(2,6),
          company:c, role:r, date:todayKey(), status:'applied' });
      });
      var f = document.getElementById('a-co'); if(f) f.focus();
    }
    document.getElementById('a-go').onclick = add;
    [co,ro].forEach(function(i){ i.onkeydown = function(e){ if(e.key==='Enter') add(); }; });

    Array.prototype.forEach.call(document.querySelectorAll('select.st'), function(sel){
      sel.onchange = function(){
        commit(function(){
          var id = sel.getAttribute('data-id');
          for(var i=0;i<S.apps.length;i++){ if(S.apps[i].id===id){ S.apps[i].status = sel.value; break; } }
        });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-del');
        commit(function(){ S.apps = S.apps.filter(function(x){ return x.id !== id; }); });
      };
    });

    /* everything below is plain DOM \u2014 no prompt(), confirm(), or downloads,
       because the frame this runs in blocks all three. */

    function say(id, msg, bad){
      var el = document.getElementById(id);
      if(!el) return;
      el.className = 'said' + (bad ? ' bad' : '');
      el.textContent = msg;
      setTimeout(function(){ if(el) el.textContent = ''; }, 3000);
    }

    document.getElementById('b-dates').onclick = function(){
      var s  = document.getElementById('d-start').value;
      var e1 = document.getElementById('d-e1').value;
      var e2 = document.getElementById('d-e2').value;
      if(!isDate(s)){ say('say-dates','Pick a start date first', true); return; }
      commit(function(){
        S.start = s;
        S.exam1 = isDate(e1) ? e1 : '';
        S.exam2 = isDate(e2) ? e2 : '';
      });
      say('say-dates','Saved');
    };

    var out = document.getElementById('out');

    document.getElementById('b-csv').onclick = function(){
      var rows = [['week','date','company','role','status']].concat(
        S.apps.map(function(a){ return [weekOf(a.date), a.date, a.company, a.role, a.status]; }));
      out.value = rows.map(function(r){
        return r.map(function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }).join(',');
      }).join('\n');
      out.focus(); out.select();
      say('say-copy','Ready \u2014 copy it');
    };

    document.getElementById('b-backup').onclick = function(){
      out.value = JSON.stringify(S);
      out.focus(); out.select();
      say('say-copy','Ready \u2014 copy it');
    };

    document.getElementById('b-copy').onclick = function(){
      if(!out.value){ say('say-copy','Nothing to copy yet', true); return; }
      out.focus(); out.select();
      var done = false;
      try{ done = document.execCommand('copy'); }catch(e){}
      if(done){ say('say-copy','Copied'); return; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(out.value).then(
          function(){ say('say-copy','Copied'); },
          function(){ say('say-copy','Use Cmd/Ctrl+C \u2014 it is selected', true); }
        );
      } else {
        say('say-copy','Use Cmd/Ctrl+C \u2014 it is selected', true);
      }
    };

    document.getElementById('b-restore').onclick = function(){
      var raw = (document.getElementById('inp').value || '').trim();
      if(!raw){ say('say-restore','Paste a backup first', true); return; }
      var d;
      try{ d = JSON.parse(raw); }catch(e){ say('say-restore','That is not valid backup text', true); return; }
      if(!d || !Array.isArray(d.apps)){ say('say-restore','That is not a tracker backup', true); return; }
      var n = d.apps.length;
      commit(function(){ S = sanitize(d); });
      say('say-restore','Loaded ' + n + ' entries');
    };

    /* two-press delete, since confirm() is blocked */
    var rb = document.getElementById('b-reset');
    var armed = false, armTimer = null;
    rb.onclick = function(){
      if(!armed){
        armed = true;
        rb.textContent = 'Press again to confirm';
        say('say-reset','This cannot be undone', true);
        armTimer = setTimeout(function(){
          armed = false;
          if(rb) rb.textContent = 'Delete everything';
        }, 5000);
        return;
      }
      clearTimeout(armTimer);
      hardReset();
    };
  }

  loadState().then(safeRender).catch(function(err){
    console.error(err);
    S = sanitize(null);
    MODE = 'memory';
    safeRender();
  });
})();
</script>
